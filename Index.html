    content: '';
    position: fixed;
    inset: 0;
    background-image:

    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  .page-wrapper {

    z-index: 1;
    max-width: 800px;
    margin: 0 auto;
    padding: 0 16px 140px;
  }

  /* ── HEADER ── */
  .header {
    padding: 28px 0 20px;
    text-align: center;
  }

  .header-eyebrow {
    font-family: 'Orbitron', monospace;
    font-size: 10px;
    letter-spacing: 4px;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 8px;
    opacity: 0.8;
  }

  .header-title {
    font-family: 'Orbitron', monospace;
    font-size: clamp(22px, 7vw, 38px);
    font-weight: 900;
    letter-spacing: -1px;
    color: var(--text-bright);
    text-shadow: 0 0 30px rgba(0,229,255,0.4);
    line-height: 1.1;
  }

  .header-title span { color: var(--accent); }
  .header-line {
    width: 60px;
    height: 2px;
    background: linear-gradient(90deg, var(--accent2), var(--accent));
    margin: 12px auto 0;
  }

  /* ── USER PANEL ── */
  .user-panel {
    background: var(--surface);
    border: 1px dashed var(--border);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 16px;
    transition: border-color 0.3s;
  }
  .user-panel.active-border {
    border-color: var(--accent2);
    box-shadow: 0 0 15px rgba(123, 47, 255, 0.15);
  }
  .user-label {
    display: block;
    font-family: 'Orbitron', monospace;
    font-size: 11px;
    letter-spacing: 1px;
    color: var(--text-bright);
    margin-bottom: 8px;
    text-transform: uppercase;
  }
  #username {
    width: 100%;
    padding: 12px;
    font-family: 'Exo 2', sans-serif;
    font-size: 14px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text-bright);
    outline: none;
    transition: all 0.2s;
  }
  #username:focus {
    border-color: var(--accent2);
    box-shadow: 0 0 10px rgba(123, 47, 255, 0.2);
  }

  /* ── SEARCH BAR ── */
  .search-wrap {
    position: sticky;
    top: 0;
    z-index: 100;
    padding: 12px 0 10px;
    background: linear-gradient(to bottom, var(--bg) 80%, transparent);
  }

  .search-inner { position: relative; }
  .search-icon {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    width: 16px;
    height: 16px;
    color: var(--accent);
    opacity: 0.7;
  }

  #search {
    width: 100%;
    padding: 12px 14px 12px 42px;
    font-family: 'Exo 2', sans-serif;
    font-size: 14px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text-bright);
    outline: none;
  }

  #search:focus {
    border-color: var(--accent);
    box-shadow: var(--glow);
  }

  .search-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 8px;
  }

  #count {

  .limit-warning {

    color: var(--accent3);
    font-weight: 500;
    display: none;
  }

  /* ── GRID & CARDS ── */
  #grid {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .game-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    gap: 14px;
    align-items: flex-start;
  }

  /* État bloqué si pas de pseudo */
  .game-card.locked-user {
    opacity: 0.4;
    cursor: not-allowed;
  }

  .game-card.selected {
    border-color: var(--accent);
    background: rgba(0, 229, 255, 0.02);
  }

  .game-card.disabled-limit {
    opacity: 0.3;
    cursor: not-allowed;
    border-color: var(--border);
  }

  .card-main { flex: 1; }
  .card-header { display: flex; align-items: flex-start; justify-content: space-between; }
  .game-title { font-family: 'Orbitron', monospace; font-size: 13px; font-weight: 700; color: var(--text-bright); }
  
  .card-toggle {
    color: var(--text-dim);
    transition: transform 0.2s;
  }
  .game-card.expanded .card-toggle { transform: rotate(180deg); color: var(--accent); }

  .game-desc {
    font-size: 13px;
    color: var(--text-dim);
    line-height: 1.6;
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.3s ease, margin-top 0.2s;
  }

  .game-card.expanded .game-desc { max-height: 200px; margin-top: 10px; }

  /* Checkbox */
  .custom-checkbox {
    width: 18px;
    height: 18px;
    border: 2px solid var(--border);
    border-radius: 4px;
    position: relative;
    background: var(--surface2);
  }

  .game-card.selected .custom-checkbox {
    border-color: var(--accent);
    background: var(--accent);
  }

  .game-card.selected .custom-checkbox::after {
    content: '';
    position: absolute;
    left: 5px;
    top: 2px;
    width: 4px;
    height: 8px;
    border: solid var(--bg);
    border-width: 0 2px 2px 0;
    transform: rotate(45deg);
  }

  .highlight { color: var(--accent); }

  /* ── BOTTOM BAR ── */
  .action-bar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: rgba(13, 17, 23, 0.9);
    backdrop-filter: blur(12px);
    border-top: 1px solid var(--border);
    padding: 16px;
    z-index: 1000;
  }

  .action-bar-inner {
    max-width: 800px;
    margin: 0 auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .selection-count {

    color: var(--accent);
    font-size: 18px;
  }

  .selection-label { font-size: 11px; color: var(--text-dim); text-transform: uppercase; }

  .btn-export {

  }

  .btn-export:disabled {

    color: var(--text-dim);

  }

  ["Zillion", "Jeu de type Metroidvania sorti en 1987 sur Sega Master System 8 bits."],
  ["Zork: Grand Inquisitor", "Le jeu d'aventure humoristique et loufoque en pointer-cliquer."]
];

const chevronSVG = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>`;
let selectedGames = new Set();

function escapeHtml(str) { return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function highlight(text, query) {
  if (!query) return escapeHtml(text);
  const escaped = escapeHtml(text);
  return escaped.replace(new RegExp(`(${query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi'), '<span class="highlight">$1</span>');
}

// Vérifie si le pseudo est rempli
function getUsername() {
  return document.getElementById('username').value.trim();
}

function checkUserChange() {
  const name = getUsername();
  const panel = document.getElementById('user-panel');
  
  if (name !== "") {
    panel.classList.add('active-border');
  } else {
    panel.classList.remove('active-border');
    // Si l'utilisateur efface son nom, on décoche tout par sécurité
    selectedGames.clear();
  }
  updateUI();
}

function toggleSelectCard(card, title, event) {
  if (event.target.closest('.game-desc') || event.target.closest('.card-toggle')) return;
  
  // Bloquer si le nom n'est pas écrit
  if (getUsername() === "") {
    document.getElementById('username').focus();
    return;
  }

  if (selectedGames.has(title)) {
    selectedGames.delete(title);
  } else {
    if (selectedGames.size >= 3) return;
    selectedGames.add(title);
  }
  
  updateUI();
}

function updateUI() {
  const hasUser = getUsername() !== "";
  const size = selectedGames.size;

  document.getElementById('selected-count').textContent = size;
  // Le bouton s'active si la liste a au moins 1 jeu ET qu'un nom est présent
  document.getElementById('export-btn').disabled = (size === 0 || !hasUser);

  // Alerte limite
  document.getElementById('limit-msg').style.display = (size >= 3) ? 'inline' : 'none';

  // Mise à jour des cartes
  const cards = document.querySelectorAll('.game-card');
  cards.forEach(card => {
    const cardTitle = card.querySelector('.game-title').textContent;
    
    // Si pas de pseudo, on applique un style de verrouillage global
    if (!hasUser) {
      card.classList.add('locked-user');
      card.classList.remove('selected', 'disabled-limit');
      return;
    }
    card.classList.remove('locked-user');

    if (selectedGames.has(cardTitle)) {
      card.classList.add('selected');
      card.classList.remove('disabled-limit');
    } else {
      card.classList.remove('selected');
      if (size >= 3) {
        card.classList.add('disabled-limit');
      } else {
        card.classList.remove('disabled-limit');
      }
    }
  });
}

function filterGames() {
  const q = document.getElementById('search').value.trim().toLowerCase();
  const grid = document.getElementById('grid');
  const countEl = document.getElementById('count');
  grid.innerHTML = '';
  let visible = 0;

  games.forEach(([title, desc]) => {
    if (!q || title.toLowerCase().includes(q) || desc.toLowerCase().includes(q)) {
      const card = document.createElement('div');
      card.className = 'game-card';
      
      card.innerHTML = `
        <div style="padding-top:2px;"><div class="custom-checkbox"></div></div>
        <div class="card-main">
          <div class="card-header">
            <div class="game-title">${highlight(title, q)}</div>
            <div class="card-toggle" onclick="event.stopPropagation(); this.closest('.game-card').classList.toggle('expanded')">${chevronSVG}</div>
          </div>
          <div class="game-desc">${highlight(desc, q)}</div>
        </div>
      `;
      
      card.addEventListener('click', (e) => toggleSelectCard(card, title, e));
      grid.appendChild(card);
      visible++;
    }
  });

  countEl.textContent = `${visible} jeu(x) trouvé(s)`;
  updateUI();
}

// Export au format d'origine (Propre & Lisible) incluant l'utilisateur
function exportSelection() {
  const user = getUsername();
  if (selectedGames.size === 0 || user === "") return;
  
  let content = "=== ARCHIPELAGO - JEUX SÉLECTIONNÉS ===\n";
  content += `Utilisateur    : ${user}\n`;
  content += `Date du choix  : ${new Date().toLocaleDateString()} à ${new Date().toLocaleTimeString()}\n`;
  content += `Nombre de jeux : ${selectedGames.size} / 3\n`;
  content += "---------------------------------------\n\n";
  
  Array.from(selectedGames).sort().forEach(game => {
    content += `- ${game}\n`;
  });

  // Nettoyage du pseudo pour éviter les caractères interdits dans le nom de fichier Windows/Linux
  const safeUser = user.replace(/[^a-zA-Z0-9]/g, "_");
  
  const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = `choix_archipelago_${safeUser}.txt`;
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  URL.revokeObjectURL(url);
}

// Premier lancement
filterGames();
</script>
</body>
</html>
